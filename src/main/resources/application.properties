spring.application.name=clinic-management

# PostgreSQL connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clinic_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Ejecuta data.sql después de que Hibernate cree las tablas (ddl-auto=update)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# JWT (usa el valor por defecto solo en local; en despliegues reales define JWT_SECRET)
jwt.secret=${JWT_SECRET:OleC4bTLudBPzMedAXLQUmOpVWMnzzMWcM4G6cH/WD4=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Bootstrap admin (created automatically on first run if the users table is empty)
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@clinic.com}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:Admin123!}
